<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>{{TITLE}}</title>
    <script src="node_modules/gsap/dist/gsap.min.js"></script>
    <script src="lib/core/toon.js"></script>
    <script src="lib/core/fx.js"></script>
    <script src="lib/core/scenes.js"></script>
    <script src="lib/core/shapes.js"></script>
    <script src="lib/styles/{{STYLE}}/style.js"></script>
    <script src="lib/characters/pip/rig.js"></script>
    <!-- written by scripts/audio.mjs: duration, caption cues -->
    <script src="cf-data.js"></script>
    <style>
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { width: 100%; height: 100%; }
      svg { display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-fps="24" data-width="1080" data-height="1920">
      <!-- cf:audio -->
      <svg id="stage" class="clip" data-start="0" data-duration="10" data-track-index="0"
           xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
    </div>

    <script>
      /*
       * A 10-second reel in 6 beats:
       *   0.0–1.6  title card                     (iris in)
       *   1.6–4.4  Pip walks in, the world moves to the style's beat
       *   4.4–5.0  stops, looks at camera, blinks
       *   5.0–6.8  anticipation → jump (stretch) → land (squash) → settle
       *   6.8–end  waves hello (holds while the voice-over finishes)
       *   last 1.4 s  iris out on Pip, end card
       */
      const W = 1080, H = 1920, GROUND = 1480;
      const T = Toon, { track, seg, onTwos } = T;
      const style = T.styles["{{STYLE}}"];
      const BEAT = 60 / style.motion.bpm;
      const CF = window.CF || { duration: 10, captions: [] };
      const DUR = CF.duration;

      // ---------- shared building blocks (core/), styled by the style pack
      const svg = document.getElementById("stage");
      const look = style.install(svg, { width: W, height: H });          // layers + film texture
      const world = style.scenery(look, { width: W, height: H, ground: GROUND }); // background
      // the character(s): reference rig for tests — replace with the user's own characters (see lib/characters/README.md)
      const pip = T.characters.pip.build(look.scene, style.skin);
      const updateCaptions = T.captions(look.overlay, CF.captions, style.caption || {});
      const ends = T.scenes.bookends(look.overlay, {                     // title card, iris, end card
        width: W, height: H, duration: DUR, theme: style.cards,
        title: "{{TITLE}}", subtitle: "{{SUBTITLE}}",
      });

      // ---------- render(t): the whole film as a pure function of time
      function render(tRaw) {
        const t = onTwos(tRaw, style.motion.drawingsPerSecond); // stepped drawings
        look.update(tRaw);
        world.update(t, { beat: BEAT });
        updateCaptions(t);

        // ---- Pip
        const walkEnd = 4.4;
        const x = track(t, [[1.6, -260], [walkEnd, 470, "outQuad"]]);
        const walking = t < walkEnd ? 1 : 0;
        const stride = (t / BEAT) * Math.PI; // one step per beat
        const s = Math.sin(stride);

        // jump: anticipation (5.0–5.6) → air (5.6–6.4) → land (6.4–6.8)
        const jumpY = track(t, [[5.6, 0], [6.0, -250, "outQuad"], [6.4, 0, "inQuad"]]);
        let sq = walking * -0.05 * Math.abs(Math.cos(stride));
        sq += track(t, [[5.0, 0], [5.5, -0.28, "outQuad"], [5.65, 0.3, "outQuad"], [6.0, 0.08], [6.4, 0.18, "inQuad"], [6.5, -0.34, "outQuad"], [6.9, 0, "outElastic"]]);

        const wave = seg(t, 6.8, 7.1) * (1 - seg(t, DUR - 1.6, DUR - 1.3));
        const waveSwing = Math.sin((t - 6.8) * 9) * 60;
        const crouch = track(t, [[5.0, 0], [5.5, 1], [5.65, 0]]);
        const air = track(t, [[5.6, 0], [5.8, 1], [6.3, 1], [6.45, 0]]);

        pip.pose({
          x, y: GROUND + jumpY, scale: 1.12,
          squash: sq,
          lean: walking * s * 4 + track(t, [[4.4, 0], [4.6, -6, "outBack"], [5.0, 0]]),
          stepL: walking ? { x: s * 46, y: -Math.max(0, s) * 50 } : { x: 0, y: -air * 40 },
          stepR: walking ? { x: -s * 46, y: -Math.max(0, -s) * 50 } : { x: 0, y: -air * 40 },
          handL: walking
            ? { x: -s * 50, y: -Math.abs(s) * 20 }
            : { x: crouch * 40 - air * 30, y: crouch * 60 - air * 290 },
          handR: walking
            ? { x: s * 50, y: -Math.abs(s) * 20 }
            : { x: -crouch * 40 + air * 30 - wave * 10 + wave * waveSwing * 0.4, y: crouch * 60 - air * 290 - wave * 330 },
          bendR: -40 + wave * 70,
          look: track(t, [[4.4, 0], [4.6, 0.6], [6.8, 0.6], [7.0, 0]]),
          blink: seg(t, 4.75, 4.83) * (1 - seg(t, 4.83, 4.92)) + seg(t, 7.9, 7.98) * (1 - seg(t, 7.98, 8.06)),
          mouth: track(t, [[5.5, 0], [5.7, 0.9], [6.4, 0.9], [6.6, 0.3], [7.0, 0.6], [DUR - 1.6, 0.6], [DUR - 1.4, 0.1]]),
          sprout: Math.sin(t * 7) * 10 + track(t, [[5.6, 0], [5.8, -25], [6.4, 30], [6.8, 0, "outElastic"]]),
        });

        ends.update(t, { x, y: GROUND - 500 });
      }

      T.film({ id: "main", duration: DUR, render });
    </script>
  </body>
</html>
